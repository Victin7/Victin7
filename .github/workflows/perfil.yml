name: Atualizar perfil

on:
  schedule:
    - cron: "17 9 * * *"   # todo dia às 06:17 de Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/perfil.yml"]

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Aranha, estatísticas e seção Agora
        run: node scripts/gerar-perfil.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prints dos projetos (aos domingos, ou ao rodar manualmente)
        if: github.event_name != 'schedule' || startsWith(github.event.schedule, '17 9')
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%u)" != "7" ]; then echo "hoje não"; exit 0; fi
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          node scripts/prints.mjs

      - name: Salvar mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git diff --cached --quiet || git commit -m "Perfil atualizado automaticamente"
          git push
